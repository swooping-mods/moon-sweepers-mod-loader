name: Release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use installed LLVM tools
        run: echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Verify source
        run: python3 tools/check.py --host-only
      - name: Stage exact reviewed runtime inputs
        run: python3 tools/fetch_windows_inputs.py --output local/windows-inputs
      - name: Build and verify candidate without publishing
        run: |
          python3 tools/build_windows.py --inputs local/windows-inputs
          python3 tools/check_windows_bundle.py
      - name: Retain candidate and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moon-sweepers-mod-loader-candidate
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/*checks.json
            artifacts/*receipt.json
