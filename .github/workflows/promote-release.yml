name: Promote to full release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing checked prerelease tag (for example v0.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  promote:
    name: Verify and promote existing release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Promote the checked assets and mark latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/promote_release.py "$RELEASE_TAG"
